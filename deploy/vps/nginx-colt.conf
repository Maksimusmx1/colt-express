# TLS reverse proxy (wss:// + https://) для сервера Colt Express (сценарий A).
# Клиент (сборка 9+) сам выбирает схему: если в поле адреса указать
# "wss://домен" или "https://домен" — подключение пойдёт по TLS, иначе — по ws.
# Для локального сервера этот конфиг не нужен (обычный ws:// без TLS).
#
# Установка на VPS (Debian/Ubuntu):
#   sudo apt-get install -y nginx certbot python3-certbot-nginx
#   sudo cp /tmp/colt-deploy/nginx-colt.conf /etc/nginx/sites-available/colt
#   sudo sed -i 's/colt.example.com/YOUR_DOMAIN/g' /etc/nginx/sites-available/colt
#   sudo ln -s /etc/nginx/sites-available/colt /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d YOUR_DOMAIN
#
# В приложении укажите адрес:  YOUR_DOMAIN   (wss:// подставится сам)

server {
    listen 443 ssl http2;
    server_name colt.example.com;

    ssl_certificate     /etc/letsencrypt/live/colt.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/colt.example.com/privkey.pem;

    # WebSocket (обновление соединения)
    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Остальное: /health, /apk (APK ~ десятки МБ — не обрезаем таймауты)
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# HTTP -> HTTPS
server {
    listen 80;
    server_name colt.example.com;
    return 301 https://$host$request_uri;
}
