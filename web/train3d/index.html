<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>3D поезд Colt Express</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #1a0a2e; overflow: hidden; font-family: 'Segoe UI', sans-serif; color: #e0e0e0; }

  #status { position: fixed; top: 26px; left: 8px; background: rgba(0,0,0,0.65); color: #d4a040; padding: 4px 10px; border-radius: 4px; font-size: 11px; z-index: 10; pointer-events: none; font-family: monospace; }
  #views { position: fixed; top: 6px; right: 8px; background: rgba(0,0,0,0.65); padding: 4px; border-radius: 4px; z-index: 10; }

  #views button.active { background: #d4a040; color: #1a1a1a; }
  #players { position: fixed; top: 38px; right: 8px; background: rgba(0,0,0,0.65); padding: 4px 6px; border-radius: 4px; z-index: 10; color: #d4a040; font-size: 11px; }
  #players button { background: transparent; color: #d4a040; border: 1px solid rgba(212,160,64,0.4); padding: 4px 8px; margin-left: 2px; border-radius: 3px; font-size: 11px; cursor: pointer; }

  #players button.active { background: #d4a040; color: #1a1a1a; }
  #legend { position: fixed; bottom: 8px; right: 8px; background: rgba(0,0,0,0.65); padding: 6px; border-radius: 6px; z-index: 10; color: #d4a040; font-size: 11px; }
  #hover { position: fixed; background: rgba(0,0,0,0.85); color: #d4a040; padding: 6px 10px; border-radius: 4px; font-size: 12px; z-index: 10; pointer-events: none; display: none; border: 1px solid #3a3a3a; }
</style>

<div id="status">ожидание state…</div>
<div id="views">
  <button data-view="top">Сверху</button>
  <button data-view="three">3/4</button>
  <button data-view="side" class="active">Сбоку</button>
  <button data-view="close">Кабина</button>
  <button data-view="orbit">Обзор 360°</button>
</div>
<canvas id="c"></canvas>
<div id="hover"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// === STATE (set from host page via setState/postMessage) ===
let STATE_DATA = null;
let STATE_MODE = false; // true = real game state; false = default beautiful design

// Cab geometry parameters (shared between buildLocomotive, addEngineer, and rebuild).
const cabCx = -2.4;     // cab center X (in loco local space)
const cabLen = 3.0;     // cab length — extended for sheriff + 2 briefcases
const cabCornerH = 1.70; // cab corner post height

function updateStatus() {
  const el = document.getElementById('status');
  if (!el) return;
  if (!STATE_MODE || !STATE_DATA) {
    el.textContent = 'ожидание state…';
    return;
  }
  const n = (STATE_DATA.players || []).length;
  el.textContent = `state: cars=${STATE_DATA.cars.length} игроков=${n} шериф=${STATE_DATA.sheriffCar}${STATE_DATA.sheriffOnRoof ? '↑' : ''}`;
}
function applyState(json) {
  try {
    const data = typeof json === 'string' ? JSON.parse(json) : json;
    if (data && Array.isArray(data.cars)) {
      STATE_DATA = data;
      STATE_MODE = true;
      rebuild();
      updateStatus();
      console.log('[3D] applied state: cars=', data.cars.length, 'sheriffCar=', data.sheriffCar, 'sheriffOnRoof=', data.sheriffOnRoof, 'players=', (data.players||[]).length);
      // Log each car's content for debugging.
      data.cars.forEach((c, i) => {
        console.log(`[3D] car ${c.index}: insideLoot=${(c.lootInside||[]).length}, insidePlayers=${(c.inside||[]).length}, roofLoot=${(c.lootRoof||[]).length}, roofPlayers=${(c.roof||[]).length}`);
      });
      console.log('[3D] players:', (data.players||[]).map(p => p.id + ':' + p.character).join(', '));
    } else {
      console.warn('[3D] applyState: payload has no cars array', data);
    }
  } catch (e) { console.error('[3D] applyState error', e); }
}
window.setState = applyState;
window.addEventListener('message', (e) => {
  if (e.data && e.data.type === 'setState') applyState(e.data.payload);
});

// === Three.js setup ===
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;

const scene = new THREE.Scene();
const skyGeo = new THREE.SphereGeometry(400, 32, 16);
const skyMat = new THREE.ShaderMaterial({
  uniforms: { topColor: { value: new THREE.Color(0x1a0a2e) }, midColor: { value: new THREE.Color(0xc85a28) }, bottomColor: { value: new THREE.Color(0xf0c060) } },
  vertexShader: `varying vec3 vWorldPosition; void main(){ vec4 wp = modelMatrix * vec4(position,1.0); vWorldPosition = wp.xyz; gl_Position = projectionMatrix * viewMatrix * wp; }`,
  fragmentShader: `uniform vec3 topColor; uniform vec3 midColor; uniform vec3 bottomColor; varying vec3 vWorldPosition; void main(){ float h = normalize(vWorldPosition).y; vec3 col = h < 0.15 ? mix(bottomColor, midColor, h/0.15) : mix(midColor, topColor, (h-0.15)/0.85); gl_FragColor = vec4(col, 1.0); }`,
  side: THREE.BackSide, depthWrite: false
});
scene.add(new THREE.Mesh(skyGeo, skyMat));
scene.fog = new THREE.Fog(0xf0c060, 60, 180);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 3.5, 16);
const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 1.5, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 6;
controls.maxDistance = 120;
controls.maxPolarAngle = Math.PI * 0.49;

const hemi = new THREE.HemisphereLight(0xffd090, 0x8a6030, 0.6);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffe0a0, 1.5);
sun.position.set(60, 30, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -50; sun.shadow.camera.right = 50;
sun.shadow.camera.top = 50; sun.shadow.camera.bottom = -50;
sun.shadow.camera.near = 1; sun.shadow.camera.far = 100;
sun.shadow.bias = -0.0005;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xc07030, 0.3);
fill.position.set(-20, 10, -10);
scene.add(fill);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(300, 120),
  new THREE.MeshStandardMaterial({ color: 0xc8a060, roughness: 0.95 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.01;
ground.receiveShadow = true;
scene.add(ground);

// Desert details: scattered small rocks
const rockMat = new THREE.MeshStandardMaterial({ color: 0x9a7a50, roughness: 0.9 });
for (let i = 0; i < 40; i++) {
  const rx = (Math.random() - 0.5) * 120;
  const rz = 6 + Math.random() * 40;
  const rs = 0.15 + Math.random() * 0.35;
  const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(rs, 0), rockMat);
  rock.position.set(rx, rs * 0.4, rz);
  rock.rotation.set(Math.random(), Math.random(), Math.random());
  rock.castShadow = true;
  scene.add(rock);
  // Mirror to other side of tracks
  const rock2 = rock.clone();
  rock2.position.z = -rz;
  scene.add(rock2);
}

// Distant mesas / buttes
const mesaMat = new THREE.MeshStandardMaterial({ color: 0xb07040, roughness: 0.9 });
const mesaDarkMat = new THREE.MeshStandardMaterial({ color: 0x7a4828, roughness: 0.95 });
function addMesa(x, z, w, h, d) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mesaMat);
  m.position.set(x, h / 2, z);
  m.castShadow = true;
  scene.add(m);
  // Flat top layer
  const top = new THREE.Mesh(new THREE.BoxGeometry(w * 1.05, h * 0.08, d * 1.05), mesaDarkMat);
  top.position.set(x, h, z);
  scene.add(top);
}
addMesa(-70, -55, 25, 18, 12);
addMesa(-30, -60, 15, 12, 10);
addMesa(20, -58, 30, 22, 15);
addMesa(60, -52, 20, 15, 11);
addMesa(90, -65, 18, 10, 8);
addMesa(-85, 55, 20, 14, 10);
addMesa(-20, 60, 28, 20, 14);
addMesa(45, 58, 22, 16, 12);
addMesa(80, 62, 16, 11, 9);

// Cacti
const cactusMat = new THREE.MeshStandardMaterial({ color: 0x2d6b1e, roughness: 0.85 });
function addCactus(x, z, h) {
  const g = new THREE.Group();
  // Trunk
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.15, h, 6), cactusMat);
  trunk.position.y = h / 2;
  g.add(trunk);
  if (h > 1.5) {
    // Left arm
    const armL = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, h * 0.4, 5), cactusMat);
    armL.position.set(-0.2, h * 0.6, 0);
    armL.rotation.z = Math.PI / 5;
    g.add(armL);
    const armLtop = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.08, h * 0.25, 5), cactusMat);
    armLtop.position.set(-0.2 - h * 0.06, h * 0.6 + h * 0.15, 0);
    g.add(armLtop);
    // Right arm
    const armR = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, h * 0.35, 5), cactusMat);
    armR.position.set(0.2, h * 0.45, 0);
    armR.rotation.z = -Math.PI / 4.5;
    g.add(armR);
    const armRtop = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.08, h * 0.22, 5), cactusMat);
    armRtop.position.set(0.2 + h * 0.05, h * 0.45 + h * 0.12, 0);
    g.add(armRtop);
  }
  g.position.set(x, 0, z);
  g.castShadow = true;
  scene.add(g);
}
addCactus(-50, 12, 2.2);
addCactus(-35, -10, 1.8);
addCactus(-15, 15, 2.5);
addCactus(10, -14, 1.6);
addCactus(30, 10, 2.0);
addCactus(50, -12, 2.3);
addCactus(-60, -8, 1.4);
addCactus(70, 8, 1.9);
addCactus(-42, 18, 1.7);
addCactus(25, -18, 2.1);
addCactus(55, 16, 1.5);

// Large setting sun in background
const sunDisc = new THREE.Mesh(
  new THREE.CircleGeometry(8, 32),
  new THREE.MeshBasicMaterial({ color: 0xf08020, transparent: true, opacity: 0.8, side: THREE.DoubleSide })
);
sunDisc.position.set(0, 12, -160);
scene.add(sunDisc);
// Sun glow
const sunGlow = new THREE.Mesh(
  new THREE.CircleGeometry(14, 32),
  new THREE.MeshBasicMaterial({ color: 0xf0a040, transparent: true, opacity: 0.25, side: THREE.DoubleSide })
);
sunGlow.position.set(0, 12, -161);
scene.add(sunGlow);

const sleeperMat = new THREE.MeshStandardMaterial({ color: 0x4a3520, roughness: 0.9 });
for (let z = -25; z <= 25; z += 0.9) {
  const s = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.08, 0.18), sleeperMat);
  s.position.set(0, 0.04, z);
  s.receiveShadow = true;
  scene.add(s);
}
const railMat = new THREE.MeshStandardMaterial({ color: 0x4a4a4a, metalness: 0.7, roughness: 0.4 });
for (const x of [-0.95, 0.95]) {
  const rail = new THREE.Mesh(new THREE.BoxGeometry(80, 0.12, 0.12), railMat);
  rail.position.set(0, 0.16, x);
  rail.castShadow = true;
  scene.add(rail);
}

const mat = {
  locoBody: new THREE.MeshStandardMaterial({ color: 0x1f3a25, roughness: 0.55, metalness: 0.2 }),
  locoAccent: new THREE.MeshStandardMaterial({ color: 0x6a4a1a, roughness: 0.6, metalness: 0.3 }),
  brass: new THREE.MeshStandardMaterial({ color: 0xb88a3a, roughness: 0.35, metalness: 0.85 }),
  boiler: new THREE.MeshStandardMaterial({ color: 0x14201a, roughness: 0.4, metalness: 0.5 }),
  boilerBand: new THREE.MeshStandardMaterial({ color: 0x9a7028, roughness: 0.4, metalness: 0.7 }),
  wheel: new THREE.MeshStandardMaterial({ color: 0x8a1a1a, roughness: 0.5, metalness: 0.3 }),
  wheelHub: new THREE.MeshStandardMaterial({ color: 0xd4a040, roughness: 0.4, metalness: 0.7 }),
  rod: new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.5, metalness: 0.5 }),
  wood: new THREE.MeshStandardMaterial({ color: 0x5a3a20, roughness: 0.85 }),
  woodDark: new THREE.MeshStandardMaterial({ color: 0x3a2818, roughness: 0.9 }),
  woodLight: new THREE.MeshStandardMaterial({ color: 0x8a6a40, roughness: 0.85 }),
  iron: new THREE.MeshStandardMaterial({ color: 0x3a3a3a, roughness: 0.5, metalness: 0.6 }),
  glass: new THREE.MeshStandardMaterial({ color: 0xa0c0d8, roughness: 0.1, metalness: 0.3, transparent: true, opacity: 0.7 }),
  skin: new THREE.MeshStandardMaterial({ color: 0xd4b48a, roughness: 0.75 }),
  skinDark: new THREE.MeshStandardMaterial({ color: 0x8a6a4a, roughness: 0.75 }),
  hairBlack: new THREE.MeshStandardMaterial({ color: 0x1a1410, roughness: 0.85 }),
  hairBrown: new THREE.MeshStandardMaterial({ color: 0x3a2418, roughness: 0.85 }),
  hairBlond: new THREE.MeshStandardMaterial({ color: 0xb88a40, roughness: 0.85 }),
  uniformCoat: new THREE.MeshStandardMaterial({ color: 0x1f2a3a, roughness: 0.7 }),
  uniformPant: new THREE.MeshStandardMaterial({ color: 0x1a1a2a, roughness: 0.7 }),
  cap: new THREE.MeshStandardMaterial({ color: 0x0a1a2a, roughness: 0.7 }),
  capBand: new THREE.MeshStandardMaterial({ color: 0xd4a040, roughness: 0.5, metalness: 0.4 }),
  // Loot.
  pouch: new THREE.MeshStandardMaterial({ color: 0xb88840, roughness: 0.85 }),
  pouchDark: new THREE.MeshStandardMaterial({ color: 0x8a6a30, roughness: 0.85 }),
  gem: new THREE.MeshStandardMaterial({ color: 0x5cf0e0, roughness: 0.15, metalness: 0.6, emissive: 0x104040, emissiveIntensity: 0.3 }),
  gemRed: new THREE.MeshStandardMaterial({ color: 0xf04848, roughness: 0.15, metalness: 0.6, emissive: 0x401010, emissiveIntensity: 0.3 }),
  briefcase: new THREE.MeshStandardMaterial({ color: 0x5a3a20, roughness: 0.65 }),
  briefcaseDark: new THREE.MeshStandardMaterial({ color: 0x3a2418, roughness: 0.65 }),
  briefcaseMetal: new THREE.MeshStandardMaterial({ color: 0xc8a040, roughness: 0.3, metalness: 0.85 }),
  paper: new THREE.MeshStandardMaterial({ color: 0xf0e8d0, roughness: 0.95 }),
  coin: new THREE.MeshStandardMaterial({ color: 0xf0c050, roughness: 0.25, metalness: 0.95 }),
  sack: new THREE.MeshStandardMaterial({ color: 0x8a6a40, roughness: 0.95 }),
  sackLight: new THREE.MeshStandardMaterial({ color: 0xa88850, roughness: 0.95 }),
  gold: new THREE.MeshStandardMaterial({ color: 0xd4a040, roughness: 0.3, metalness: 0.9, emissive: 0x4a3010, emissiveIntensity: 0.15 }),
  rope: new THREE.MeshStandardMaterial({ color: 0x4a3a20, roughness: 0.95 }),
  // Passengers.
  passengerRed: new THREE.MeshStandardMaterial({ color: 0x8a3030, roughness: 0.7 }),
  passengerBlue: new THREE.MeshStandardMaterial({ color: 0x305080, roughness: 0.7 }),
  passengerBrown: new THREE.MeshStandardMaterial({ color: 0x5a3a20, roughness: 0.7 }),
  passengerGreen: new THREE.MeshStandardMaterial({ color: 0x406040, roughness: 0.7 }),
  passengerCream: new THREE.MeshStandardMaterial({ color: 0xb8a878, roughness: 0.7 }),
  passengerBlack: new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.7 }),
  topHat: new THREE.MeshStandardMaterial({ color: 0x0a0a0a, roughness: 0.6 }),
  bowlerHat: new THREE.MeshStandardMaterial({ color: 0x1a1410, roughness: 0.6 }),
  bonnet: new THREE.MeshStandardMaterial({ color: 0xb8a8c8, roughness: 0.7 }),
  dressRed: new THREE.MeshStandardMaterial({ color: 0x8a2828, roughness: 0.7 }),
  dressBlue: new THREE.MeshStandardMaterial({ color: 0x305080, roughness: 0.7 }),
  dressGreen: new THREE.MeshStandardMaterial({ color: 0x406040, roughness: 0.7 }),
  dressPurple: new THREE.MeshStandardMaterial({ color: 0x5a3a6a, roughness: 0.7 }),
  dressCream: new THREE.MeshStandardMaterial({ color: 0xc8b888, roughness: 0.7 }),
  suitBlack: new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.7 }),
  suitBrown: new THREE.MeshStandardMaterial({ color: 0x3a2418, roughness: 0.7 }),
  suitNavy: new THREE.MeshStandardMaterial({ color: 0x1a2a4a, roughness: 0.7 }),
  suitGray: new THREE.MeshStandardMaterial({ color: 0x5a5a5a, roughness: 0.7 }),
  trimGold: new THREE.MeshStandardMaterial({ color: 0xd4a040, roughness: 0.5, metalness: 0.4 }),
};

function characterColor(c) {
  switch (c) {
    case 'Doc': return new THREE.MeshStandardMaterial({ color: 0x03a9f4, roughness: 0.7 });
    case 'Django': return new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.7 });
    case 'Cheyenne': return new THREE.MeshStandardMaterial({ color: 0x2e7d32, roughness: 0.7 });
    case 'Tuco': return new THREE.MeshStandardMaterial({ color: 0xc62828, roughness: 0.7 });
    case 'Ghost': return new THREE.MeshStandardMaterial({ color: 0x546e7a, roughness: 0.7 });
    case 'Belle': return new THREE.MeshStandardMaterial({ color: 0x7b1fa2, roughness: 0.7 });
    default: return new THREE.MeshStandardMaterial({ color: 0x03a9f4, roughness: 0.7 });
  }
}

function rng(seed) { let s = seed; return () => { s = (s * 9301 + 49297) % 233280; return s / 233280; }; }

function box(w, h, d, material, parent, x=0, y=0, z=0) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
  m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  parent.add(m);
  return m;
}
function cyl(rt, rb, h, seg, material, parent, x=0, y=0, z=0, rotX=0, rotZ=0) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), material);
  m.position.set(x, y, z);
  if (rotX) m.rotation.x = rotX;
  if (rotZ) m.rotation.z = rotZ;
  m.castShadow = true; m.receiveShadow = true;
  parent.add(m);
  return m;
}

// === Person (used both in default design and game state) ===
function makePerson(parent, x, y, z, opts = {}) {
  const r = opts.rng || Math.random;
  const gender = opts.gender || (r() < 0.5 ? 'm' : 'w');
  const isChild = opts.child || false;
  const skinTone = r() < 0.85 ? mat.skin : mat.skinDark;
  const hairTones = [mat.hairBlack, mat.hairBrown, mat.hairBlond];
  const hairTone = hairTones[Math.floor(r() * hairTones.length)];
  const scl = isChild ? 0.72 : 1.0;
  const person = new THREE.Group();
  person.position.set(x, y, z);
  person.rotation.y = (opts.rotY !== undefined) ? opts.rotY : (r() - 0.5) * 0.5;
  parent.add(person);

  if (gender === 'w' && r() < 0.85) {
    const dressM = [mat.dressRed, mat.dressBlue, mat.dressGreen, mat.dressPurple, mat.dressCream, mat.suitBrown][Math.floor(r() * 6)];
    cyl(0.20 * scl, 0.32 * scl, 0.55 * scl, 12, dressM, person, 0, 0.55 * scl, 0);
    const belt = new THREE.Mesh(new THREE.TorusGeometry(0.22 * scl, 0.015, 6, 16), mat.briefcaseMetal);
    belt.rotation.x = Math.PI / 2;
    belt.position.y = 0.78 * scl;
    person.add(belt);
  } else if (gender === 'm') {
    const pantsM = [mat.suitBlack, mat.suitNavy, mat.suitGray, mat.suitBrown][Math.floor(r() * 4)];
    cyl(0.13 * scl, 0.13 * scl, 0.55 * scl, 8, pantsM, person, 0, 0.55 * scl, 0);
  } else {
    cyl(0.16 * scl, 0.26 * scl, 0.40 * scl, 10, mat.dressCream, person, 0, 0.45 * scl, 0);
  }

  if (gender === 'm') {
    const coatM = [mat.suitBlack, mat.suitNavy, mat.suitGray, mat.suitBrown, mat.uniformCoat][Math.floor(r() * 5)];
    cyl(0.18 * scl, 0.16 * scl, 0.45 * scl, 12, coatM, person, 0, 1.05 * scl, 0);
  } else {
    const dressM = [mat.dressRed, mat.dressBlue, mat.dressGreen, mat.dressPurple, mat.dressCream, mat.suitBrown][Math.floor(r() * 6)];
    cyl(0.18 * scl, 0.16 * scl, 0.35 * scl, 12, dressM, person, 0, 1.00 * scl, 0);
    cyl(0.16 * scl, 0.16 * scl, 0.06 * scl, 12, new THREE.MeshStandardMaterial({ color: 0xf0e8d0, roughness: 0.9 }), person, 0, 1.20 * scl, 0);
  }

  const armColor = gender === 'm' ? mat.suitBlack : mat.dressCream;
  for (const az of [-0.22, 0.22]) {
    const arm = cyl(0.05 * scl, 0.05 * scl, 0.45 * scl, 8, armColor, person, 0, 1.0 * scl, az * scl);
    arm.rotation.x = (r() - 0.5) * 0.3;
    const hand = new THREE.Mesh(new THREE.SphereGeometry(0.055 * scl, 8, 6), skinTone);
    hand.position.set(0, (1.0 - 0.225) * scl, az * scl);
    hand.castShadow = true;
    person.add(hand);
  }
  const neck = cyl(0.07 * scl, 0.07 * scl, 0.08 * scl, 8, skinTone, person, 0, 1.32 * scl, 0);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.13 * scl, 12, 10), skinTone);
  head.position.set(0, 1.45 * scl, 0);
  head.castShadow = true;
  person.add(head);
  if (gender === 'w') {
    const hair = new THREE.Mesh(new THREE.SphereGeometry(0.135 * scl, 12, 10, 0, Math.PI*2, 0, Math.PI*0.55), hairTone);

    hair.position.set(0, 1.46 * scl, -0.01 * scl);

  }
  const hatRoll = r();
  if (gender === 'm') {

      cyl(0.135 * scl, 0.135 * scl, 0.03 * scl, 12, mat.briefcaseMetal, person, 0, 1.65 * scl, 0);
    } else if (hatRoll < 0.7) {
      cyl(0.14 * scl, 0.16 * scl, 0.10 * scl, 14, mat.bowlerHat, person, 0, 1.58 * scl, 0);
      cyl(0.18 * scl, 0.18 * scl, 0.02 * scl, 16, mat.bowlerHat, person, 0, 1.53 * scl, 0);

  } else {

      cyl(0.20 * scl, 0.20 * scl, 0.02 * scl, 16, mat.bonnet, person, 0, 1.53 * scl, 0);
      cyl(0.165 * scl, 0.165 * scl, 0.025 * scl, 14, mat.dressRed, person, 0, 1.58 * scl, 0);

  }
  return person;
}

// === Game-style figure (bandit/sheriff, simpler) ===
// Map of last known positions by character/isSheriff, so a fresh figure picks up where the
// previous one left off — this makes movement driven by game state glide smoothly.
const lastFigurePos = new Map();
function figureKey(character, isSheriff) {
  return isSheriff ? 'sheriff' : character;
}
function makeGameFigure(parent, x, y, z, character, isSheriff=false) {
  const color = isSheriff ? new THREE.MeshStandardMaterial({ color: 0xfbc02d, roughness: 0.5, metalness: 0.4 }) : characterColor(character);
  const g = new THREE.Group();
  g.scale.set(1.2, 1.2, 1.2);
  // Pick up the previous position (if any) so animation has somewhere to glide FROM.
  const key = figureKey(character, isSheriff);
  const prev = lastFigurePos.get(key);
  const startX = prev ? prev.x : x;
  const startY = prev ? prev.y : y;
  const startZ = prev ? prev.z : z;
  g.position.set(startX, startY, startZ);
  // Remember the *target* — animate() lerps current position toward this.
  g.userData.targetPos = new THREE.Vector3(x, y, z);
  g.userData.startPos = new THREE.Vector3(startX, startY, startZ);
  g.userData.animTime = (prev && (prev.x !== x || prev.y !== y || prev.z !== z)) ? 0 : 999;
  g.userData.animDuration = 0.5;    // glide length (seconds)
  g.userData.matchKey = key;
  parent.add(g);
  for (const lz of [-0.06, 0.06]) cyl(0.05, 0.05, 0.32, 8, mat.iron, g, 0, 0.16, lz);
  for (const lz of [-0.06, 0.06]) box(0.08, 0.06, 0.12, mat.iron, g, 0.04, 0.03, lz);
  cyl(0.14, 0.12, 0.40, 12, color, g, 0, 0.50, 0);
  if (isSheriff) {
    const star = new THREE.Mesh(new THREE.CircleGeometry(0.06, 5), mat.briefcaseMetal);
    star.position.set(0, 0.55, 0.14);
    g.add(star);
    cyl(0.12, 0.12, 0.06, 10, color, g, 0, 0.74, 0);
  } else {
    const belt = new THREE.Mesh(new THREE.TorusGeometry(0.13, 0.015, 6, 16), mat.iron);
    belt.rotation.x = Math.PI / 2;
    belt.position.y = 0.42;
    g.add(belt);
    box(0.05, 0.05, 0.02, mat.briefcaseMetal, g, 0, 0.42, 0.13);
  }
  for (const az of [-0.16, 0.16]) cyl(0.04, 0.04, 0.32, 8, color, g, 0, 0.48, az);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.10, 12, 10), mat.skin);
  head.position.set(0, 0.78, 0);
  head.castShadow = true;
  g.add(head);
  if (isSheriff) {
    cyl(0.16, 0.16, 0.02, 16, color, g, 0, 0.85, 0);
    cyl(0.08, 0.08, 0.12, 12, color, g, 0, 0.92, 0);
    cyl(0.085, 0.085, 0.025, 12, mat.briefcaseDark, g, 0, 0.86, 0);
  } else {
    cyl(0.13, 0.13, 0.025, 16, color, g, 0, 0.85, 0);
    cyl(0.07, 0.07, 0.10, 12, color, g, 0, 0.93, 0);
    cyl(0.075, 0.075, 0.025, 12, mat.briefcase, g, 0, 0.86, 0);
  }
  return g;
}

function buildOpenWagon(paint) {
  const w = new THREE.Group();
  for (const x of [0.8, -0.8]) {
    for (const z of [-0.85, 0.85]) {
      const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.30, 0.30, 0.10, 16), mat.wheel);
      wheel.rotation.x = Math.PI / 2; wheel.position.set(x, 0.30, z);
      wheel.castShadow = true; w.add(wheel);
      const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.10, 0.10, 0.12, 12), mat.wheelHub);
      hub.rotation.x = Math.PI / 2; hub.position.set(x, 0.30, z);
      w.add(hub);
    }
  }
  box(2.8, 0.18, 2.0, mat.iron, w, 0, 0.55, 0);
  box(2.7, 0.05, 1.9, paint, w, 0, 0.66, 0);
  // Low rim around the platform (just for visual edge — not real walls).
  const rimH = 0.12;
  for (const z of [-0.97, 0.97]) {
    box(2.7, rimH, 0.06, paint, w, 0, 0.55 + rimH/2 + 0.04, z);
    box(2.7, 0.04, 0.10, mat.trimGold, w, 0, 0.55 + rimH + 0.05, z);
  }
  for (const ex of [-1.35, 1.35]) box(0.06, rimH + 0.04, 1.9, paint, w, ex, 0.55 + (rimH+0.04)/2, 0);
  // Roof only (no walls) — barrel / arched half-cylinder along wagon length, held by corner posts.
  const cornerH = 1.85;
  for (const ex of [-1.35, 1.35]) {
    for (const ez of [-0.95, 0.95]) {
      box(0.10, cornerH, 0.10, mat.iron, w, ex, 0.55 + cornerH/2 + 0.04, ez);
    }
  }
  // Cross beams (low, just for visual frame).
  for (const ex of [-1.30, 1.30]) {
    box(0.08, 0.06, 1.85, mat.iron, w, ex, 0.55 + cornerH + 0.05, 0);
  }
  // Roof (barrel / arched) — solid.
  const roof = new THREE.Mesh(
    new THREE.CylinderGeometry(0.97, 0.97, 2.75, 18, 1, false, 0, Math.PI),
    new THREE.MeshStandardMaterial({ color: 0x2a2018, roughness: 0.7 })
  );
  roof.rotation.z = Math.PI / 2;
  roof.position.set(0, 0.55 + cornerH + 0.10, 0);
  roof.castShadow = true;
  w.add(roof);
  // Roof eaves (front/back trim).
  for (const ex of [-1.39, 1.39]) {
    const eave = new THREE.Mesh(
      new THREE.CylinderGeometry(1.02, 1.02, 0.05, 18, 1, false, 0, Math.PI),
      mat.trimGold
    );
    eave.rotation.z = Math.PI / 2;
    eave.position.set(ex, 0.55 + cornerH + 0.10, 0);
    w.add(eave);
  }
  for (const ex of [halfL(1.4), halfL(-1.4)]) {
    for (const ez of [-0.9, 0.9]) {
      const buf = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.18, 12), mat.wood);
      buf.rotation.z = Math.PI / 2; buf.position.set(ex, 0.65, ez); w.add(buf);
    }
  }
  box(0.15, 0.1, 0.2, mat.iron, w, 1.55, 0.7, 0);
  return w;
}

function clearTrain() {
  // Snapshot current figure positions so the next rebuild's figures can glide from here.
  const savePositions = (group) => {
    if (!group) return;
    group.children.forEach(fig => {
      if (fig.userData && fig.userData.matchKey) {
        lastFigurePos.set(fig.userData.matchKey, {
          x: fig.position.x,
          y: fig.position.y,
          z: fig.position.z,
        });
      }

  };
  savePositions(train);
  savePositions(dynamicGroup);
  while (train.children.length > 0) train.remove(train.children[0]);
  if (dynamicGroup) { train.remove(dynamicGroup); dynamicGroup = null; }
}

function rebuild() {
  clearTrain();
  // Compute the train centre in loco-local space and place the train group so its centre
  // sits at the world origin (0, 0, 0). This makes the world-space centre = 0, regardless

  const wagonCount = STATE_MODE && STATE_DATA
    ? STATE_DATA.cars.filter(c => c.index !== 0).length
    : DEFAULT_LOOT_DISTRIBUTION.length;
  const trainCenterLocal = (trainLeftEdge() + trainRightEdge(wagonCount)) / 2;
  train.position.x = trainCenterLocal; // positive because train.scale.x = -1
  train.position.z = 0;

  let xPos = WAGON_START_X;  // first wagon centre (wagons fan out to the left)
  let livIdx = 0;

  if (STATE_MODE && STATE_DATA) {

    for (const car of STATE_DATA.cars) {

      const w = buildOpenWagon(liveries[livIdx++ % liveries.length]);
      w.position.x = xPos;

    dynamicGroup = new THREE.Group();

    // Place game content (loot, players, sheriff).
    let wagonIdx = 0;
    for (const car of STATE_DATA.cars) {

      wagonIdx++;
    }
    // Locomotive cab — sheriff goes here if sheriffCar == 0.
    if (STATE_DATA.sheriffCar === 0) {

        makeGameFigure(train, cabCx + 0.2, 0.88, 0, 'Ghost', true);

  } else {
    // Default design: per Colt Express rules (5 players, 4 wagons + loco, no tender).
    const wagonCount = DEFAULT_LOOT_DISTRIBUTION.length;
    for (let i = 0; i < wagonCount; i++) {
      const w = buildOpenWagon(liveries[i % liveries.length]);
      w.position.x = xPos;
      xPos -= 3.4;
      train.add(w);
    }
    dynamicGroup = new THREE.Group();
    train.add(dynamicGroup);
    // Loot per car.
    for (let i = 0; i < DEFAULT_LOOT_DISTRIBUTION.length; i++) {
      placeDefaultContent(i);
    }
    // Bandits per car (inside, not on roof).
    for (const [character, carIndex] of DEFAULT_BANDITS) {
      const xC = xPosForWagon(carIndex - 1);
      const floorY = 0.74;
      const car = { lootInside: DEFAULT_LOOT_DISTRIBUTION[carIndex] || [] };
      placeBanditsInCar(car, xC, floorY, [character]);
    }
    // Sheriff in DEFAULT_SHERIFF_CAR.

      makeGameFigure(train, cabCx + 0.2, 0.88, 0, 'Ghost', true);
    } else {
      const xC = xPosForWagon(DEFAULT_SHERIFF_CAR - 1);

function xPosForWagon(idx) {
  // Train-local coordinate of wagon idx (dynamicGroup is child of train).
  return WAGON_START_X - idx * WAGON_SPACING;
}
// Wagon centre spacing (first wagon centre at WAGON_START_X; wagons fan out to the LEFT).
const WAGON_SPACING = 3.4;
const WAGON_HALF = 1.375;            // wagonLen 2.75 / 2
const WAGON_START_X = -5.5;          // centre of wagon #1 — clear of cab (cab left edge = -3.9)
// Train horizontal bounds in loco-local space.
function trainLeftEdge() { return cabCx - cabLen / 2; }
function trainRightEdge(wagonCount) {
  // Last wagon centre = WAGON_START_X - (wagonCount-1) * spacing; right edge = centre + WAGON_HALF.
  return WAGON_START_X - (wagonCount - 1) * WAGON_SPACING + WAGON_HALF;
}
function totalTrainWidth() {
  const wagonCount = STATE_MODE && STATE_DATA
    ? STATE_DATA.cars.filter(c => c.index !== 0).length
    : DEFAULT_LOOT_DISTRIBUTION.length;
  return trainRightEdge(wagonCount) - trainLeftEdge();
}
// Train centre in world space (mid of loco + wagons).
function getTrainCenter() {
  return 0; // train is centred at world origin (position.x compensates for scale.x = -1)
}

function placeDefaultContent(wagonIdx) {
  const L = 2.8;
  const W = 2.0;
  const halfL = L / 2;
  const halfW = W / 2;
  const x = xPosForWagon(wagonIdx - 1);
  const floorY = 0.74;
  const loot = DEFAULT_LOOT_DISTRIBUTION[wagonIdx] || [];
  if (loot.length === 0) return;
  // Place loot in a row along the wagon floor.
  const usableW = L - 0.4;

  for (let i = 0; i < loot.length; i++) {

// Place bandits inside a car (for default design). Avoids overlap with existing loot.

function placeGameContent(car, xCenter, wagonIdx) {
  const L = 2.8;

  const insideLoot = car.lootInside || [];
  const insidePlayers = car.inside || [];
  const roofLoot = car.lootRoof || [];

  console.log(`[3D] car ${car.index}: insideLoot=${insideLoot.length}, insidePlayers=${insidePlayers.length}, roofLoot=${roofLoot.length}, roofPlayers=${roofPlayers.length}`);
  // Interior.
  const insideItems = insideLoot.length + insidePlayers.length;
  if (insideItems > 0) {

      makeGameFigure(dynamicGroup, xCenter + x, floorY, 0, player.character, false);
    }
  }
  // Roof.
  const roofItems = roofLoot.length + roofPlayers.length;
  if (roofItems > 0) {

    for (let i = 0; i < roofLoot.length; i++) {
      const x = -usableW/2 + spacing * (i + 0.5);

const VIEWS = {
  top:   { pos: [0, 42, 0.5],  target: [0, 1.5, 0] },
  three: { pos: [22, 34, 22],  target: [0, 1.5, 0] },
  side:  { pos: [0, 3.5, 16],    target: [0, 1.5, 0] },
  close: { pos: [-6, 4, 6],    target: [-12, 1.0, 0] },
  orbit: null,
};

// Compute the train's vertical centre so the camera target sits on the train, not on the rails.
function getTrainYCenter() {
  // Average of: floor (0.55) + half of (cabCornerH + roof top).
  // Cab top ~0.90 + cabCornerH + 0.20 ≈ 2.80. Wagon roof top ~3.47. Avg ≈ 2.0.
  return 2.0;
}
function setView(name) {
  if (name === 'orbit') {
    startOrbit();
    return;
  }
  stopOrbit();
  const v = VIEWS[name];
  if (!v) return;
  const cx = getTrainCenter();
  // Lift the target to the train's vertical centre so the camera looks at the train,
  // not at the ground / rails.
  const targetY = name === 'top' ? 0 : getTrainYCenter();
  camera.position.set(v.pos[0] + cx, v.pos[1], v.pos[2]);
  controls.target.set(v.target[0] + cx, targetY, v.target[2]);
  controls.update();
}

// 360° horizontal orbit around the train.
let orbitT = 0;
let orbitActive = false;
const ORBIT_RADIUS = 32;
const ORBIT_HEIGHT = 10;
const ORBIT_SPEED = 0.25; // radians per second
function startOrbit() {
  orbitActive = true;
  orbitT = Math.atan2(camera.position.z, camera.position.x);
  // Aim orbit at the train center (in world space) at the train's vertical centre.
  const cx = getTrainCenter();
  controls.target.set(cx, getTrainYCenter(), 0);
  document.querySelectorAll('#views button[data-view]').forEach(x => x.classList.remove('active'));
  const btn = document.querySelector('#views button[data-view="orbit"]');
  if (btn) btn.classList.add('active');
}
function stopOrbit() {
  orbitActive = false;
  document.querySelectorAll('#views button[data-view]').forEach(x => {
    if (x.dataset.view === 'orbit') x.classList.remove('active');
  });
}
function updateOrbit(dt) {
  if (!orbitActive) return;
  orbitT += dt * ORBIT_SPEED;
  const cx = controls.target.x;
  const cz = controls.target.z;
  camera.position.x = cx + Math.cos(orbitT) * ORBIT_RADIUS;
  camera.position.z = cz + Math.sin(orbitT) * ORBIT_RADIUS;
  camera.position.y = ORBIT_HEIGHT;
  camera.lookAt(controls.target);
}
document.querySelectorAll('#views button[data-view]').forEach(b => {
  b.addEventListener('click', () => {
    if (b.dataset.view === 'orbit') {
      if (orbitActive) {
        stopOrbit();
        // Restore last static view (side by default).
        document.querySelectorAll('#views button[data-view]').forEach(x => x.classList.remove('active'));
        const sideBtn = document.querySelector('#views button[data-view="side"]');
        if (sideBtn) sideBtn.classList.add('active');
        setView('side');
      } else {
        document.querySelectorAll('#views button[data-view]').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        setView('orbit');
      }
      return;
    }
    stopOrbit();
    document.querySelectorAll('#views button[data-view]').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    setView(b.dataset.view);
  });
});

// === Player-count scenario buttons ===
// Per Colt Express rules:
//   2 players -> 3 wagons + locomotive
//   3 players -> 4 wagons + locomotive
//   4-6 players -> 6 wagons + locomotive
const CHARS = ['Ghost', 'Belle', 'Doc', 'Tuco', 'Django', 'Cheyenne'];
function buildScenario(playerCount) {
  const wagonCount = playerCount <= 2 ? 3 : (playerCount === 3 ? 4 : 6);
  const players = [];
  const bandits = []; // [{character, carIndex}]
  // Players: odd -> last wagon (wagonCount), even -> second-to-last (wagonCount-1).
  const playerBanditCounts = playerCount === 2 ? [2, 2] :
                              playerCount === 3 ? [2, 2, 2] :
                              [1, 1, 1, 1, 1, 1].slice(0, playerCount);
  const wagonsForPlayer = [];
  for (let p = 0; p < playerCount; p++) {
    const num = playerBanditCounts[p];
    const isOdd = (p + 1) % 2 === 1;
    wagonsForPlayer.push([]);
    if (num === 1) {
      wagonsForPlayer[p].push(isOdd ? wagonCount : wagonCount - 1);
    } else {
      wagonsForPlayer[p].push(isOdd ? wagonCount : wagonCount - 1);
      const alt = isOdd ? wagonCount - 1 : wagonCount - 2;
      if (alt >= 1) wagonsForPlayer[p].push(alt);
    }
  }
  const cars = [{ index: 0, inside: [], roof: [], lootInside: [], lootRoof: [] }];
  for (let i = 1; i <= wagonCount; i++) {
    cars.push({ index: i, inside: [], roof: [], lootInside: [], lootRoof: [] });
  }
  // Distribute loot (2 CASE + 6 GEM + 18 POUCH = 26) evenly across all wagons,
  // so every wagon (red, green, blue, brown, cream, yellow) has loot.
  const loot = ['CASE'];
  for (let i = 0; i < 6; i++) loot.push('GEM');
  for (let i = 0; i < 18; i++) loot.push('POUCH');
  let seed = 42;
  for (let i = loot.length - 1; i > 0; i--) {
    seed = (seed * 1103515245 + 12345) & 0x7fffffff;
    const j = seed % (i + 1);
    [loot[i], loot[j]] = [loot[j], loot[i]];
  }
  const base = Math.floor(loot.length / wagonCount);
  let extra = loot.length - base * wagonCount;
  let li = 0;
  for (let i = 1; i <= wagonCount; i++) {
    const perCar = base + (extra-- > 0 ? 1 : 0);
    cars[i].lootInside = loot.slice(li, li + perCar);
    li += perCar;
  }
  // Place bandits.
  let charIdx = 0;
  for (let p = 0; p < playerCount; p++) {
    const char = CHARS[charIdx++ % CHARS.length];
    players.push({ id: 'p' + p, nickname: char, character: char });
    for (const w of wagonsForPlayer[p]) {
      bandits.push({ char, carIndex: w });
      cars[w].inside.push('p' + p);
    }
  }
  return { cars, sheriffCar: 0, sheriffOnRoof: false, players, bandits };
}

      p.sprite.material.opacity = 0.7;
      p.sprite.visible = true;
      p.vx = (Math.random()-0.5) * 0.4;
      p.vz = (Math.random()-0.5) * 0.4;
      p.vy = 0.8 + Math.random()*0.4;
    }
  }
  for (const p of smokeParticles) {
    if (!p.sprite.visible) continue;
    p.life += dt;
    if (p.life > p.maxLife) { p.sprite.visible = false; continue; }
    p.sprite.position.x += p.vx * dt;
    p.sprite.position.y += p.vy * dt;
    p.sprite.position.z += p.vz * dt;
    const k = p.life / p.maxLife;
    const s = 0.4 + k * 2.5;
    p.sprite.scale.set(s, s, s);
    p.sprite.material.opacity = 0.7 * (1 - k);
  }
  train.position.y = Math.sin(t * 1.5) * 0.02;
  // Smoothly animate bandit/sheriff figures to their target positions (driven by game state).
  // Animate figures in both dynamicGroup and train (for sheriff in locomotive, engineer).
  [dynamicGroup, train].forEach(group => {
    if (group) {
      group.children.forEach(fig => {
        const ud = fig.userData;
        if (ud && ud.targetPos && ud.startPos) {
          ud.animTime += dt;
          const k = Math.min(1, ud.animTime / ud.animDuration);
          // Ease-out cubic for a snappier glide.
          const e = 1 - Math.pow(1 - k, 3);
          fig.position.lerpVectors(ud.startPos, ud.targetPos, e);
        }
      });
    }
  });
  updateOrbit(dt);
  controls.update();
  renderer.render(scene, camera);
  // Send camera position to parent every 10 frames
  if (++frameCount % 10 === 0 && window.parent && window.parent !== window) {
    window.parent.postMessage({ type: 'cameraInfo', x: camera.position.x, y: camera.position.y, z: camera.position.z }, '*');
  }
}

rebuild();
setView('side');
animate();
</script>
</body>
</html>
